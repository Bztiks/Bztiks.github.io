<script>
// 获取不同图片的方法：添加随机参数绕过缓存
async function loadGallery() {
  const container = document.getElementById('gallery-container');
  const imageCount = 6; // 要显示的图片数量
  
  container.innerHTML = '<p style="text-align:center; padding: 40px;">加载中...</p>';
  
  try {
    let html = '';
    
    for (let i = 0; i < imageCount; i++) {
      // 关键：添加随机参数 ?t=时间戳_随机数，确保每次请求都不同
      const randomParam = `?t=${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
      const imageUrl = `https://bing.img.run/rand_uhd.php${randomParam}`;
      
      // 第一张图片作为特色大图
      if (i === 0) {
        html += `
          <div class="gallery-item featured" 
               style="background-image: url('${imageUrl}')" 
               data-title="精选风景"
               data-url="${imageUrl}">
            <div class="gallery-item__overlay"></div>
            <div class="gallery-item__title">精选风景</div>
          </div>
        `;
      } else {
        html += `
          <div class="gallery-item" 
               style="background-image: url('${imageUrl}')" 
               data-title="风景照片 ${i + 1}"
               data-url="${imageUrl}">
            <div class="gallery-item__overlay"></div>
            <div class="gallery-item__title">风景照片 ${i + 1}</div>
          </div>
        `;
      }
    }
    
    container.innerHTML = html;
    
    // 添加点击事件，使用 Fancybox 打开大图
    document.querySelectorAll('.gallery-item').forEach(item => {
      item.addEventListener('click', function() {
        const url = this.getAttribute('data-url');
        const title = this.getAttribute('data-title');
        if (typeof $.fancybox !== 'undefined') {
          $.fancybox.open({
            src: url,
            type: 'image',
            caption: title
          });
        }
      });
    });
    
  } catch (error) {
    container.innerHTML = '<p style="color:red; text-align:center;">加载失败，请刷新重试</p>';
    console.error('加载图片失败:', error);
  }
}

// 页面加载完成后执行
document.addEventListener('DOMContentLoaded', loadGallery);
</script>
